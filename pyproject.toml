[project]
name = "fake-news-router"
version = "0.1.0"
description = "Fake news classification with dual lanes (LR/SVM), routing and fusion"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/fakenews"]
