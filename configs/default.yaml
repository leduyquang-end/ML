seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  test_size: 0.15
  val_size: 0.15

preprocessing:
  unicode_form: NFC
  lowercase: true

embedding:
  model: vinai/phobert-base
  cache_dir: data/embeddings
  max_length: 256
  batch_size: 32
  pooling: cls

lanes:
  a:
    kind: logreg
    C: 1.0
  b:
    kind: svm
    C: 1.0
    kernel: linear
  calibration: sigmoid
  oof_folds: 5

routing:
  kind: rule            # rule | learned
  threshold: 0.5

fusion:
  kind: soft            # hard | soft | stacking

evaluation:
  metrics: [accuracy, f1, precision, recall, roc_auc]

artifacts_dir: artifacts
